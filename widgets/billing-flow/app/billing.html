<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Archivo:wght@500;600;700&display=swap">
<link rel="stylesheet" href="jpk.css">
<link rel="stylesheet" href="jpk-theme-v3.css">
<link rel="stylesheet" href="billing.css">
</head>
<body>
<div class="wrap">
  <header class="rec">
    <div>
      <div class="eyebrow">Vendor billing, month to pay</div>
      <h1>Billing flow</h1>
      <div class="muted sm" id="asof"></div>
    </div>
    <div class="actions">
      <span id="demo-flag" hidden><span class="chip info">Demo data</span></span>
      <div class="seg" id="scope" role="group" aria-label="Which months to show"></div>
      <label class="lead lim sm">Late after <input type="number" id="lim-late" min="0" max="120" step="1" value="15" aria-label="Days after month end before an unreconciled month counts as late"> days</label>
      <button type="button" class="btn" id="refresh">Refresh</button>
      <button type="button" class="btn" id="help">How this works</button>
    </div>
  </header>

  <section class="card sumcard" aria-label="Totals for the months shown"><div class="sum" id="sum"></div></section>

  <div id="nx"></div>

  <ol class="flow" id="flow" aria-label="Path from billing month to close-out"></ol>

  <section class="card lane-card" aria-live="polite">
    <h2><span id="lane-title">Pick a step above</span><em id="lane-hint"></em></h2>
    <div id="lane-table"></div>
  </section>
  <p class="muted sm" id="foot"></p>
</div>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<script src="jpk.js"></script>
<script src="billing-flow-model.js"></script>
<script src="demo-data.js"></script>
<script src="flow-tools.js"></script>
<script src="billing.js"></script>
<script src="jpk-intro.js"
  data-what="Follows each vendor billing month from upload, through the findings the billing check raised and the decisions made on them, to the money and the close-out. Click a step to see its records, then a record to see the month's path."
  data-fed="Billing Periods and Billing Findings (read-only), written by the monthly vendor-billing check."
  data-feeds="Nothing (read-only). Open the month or finding from the path to record a decision; the Billing Findings tool shows the vendor-by-check matrix."></script>
</body>
</html>
