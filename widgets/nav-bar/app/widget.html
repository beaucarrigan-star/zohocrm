<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav bar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Archivo:wght@500;600;700&display=swap">
<style>
html,body{margin:0;background:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){html,body{background:#191C20}}
</style>
</head>
<body>
<div id="nav"></div>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<script src="jpk-nav.js"></script>
<script>
(function () {
  var mount = document.getElementById('nav');
  var q = new URLSearchParams(location.search);
  function draw(entity) { JPK.navBar(mount, entity); }
  if (q.get('demo') !== null || typeof ZOHO === 'undefined') { draw(q.get('module') || 'Cases'); return; }
  draw('');  /* Home shows at once; Back appears when the module is known */
  try {
    ZOHO.embeddedApp.on('PageLoad', function (d) {
      draw(d && d.Entity);
      try { ZOHO.CRM.UI.Resize({ height: '52', width: '100%' }); } catch (e) {}
    });
    ZOHO.embeddedApp.init();
  } catch (e) { /* stay on Home-only bar */ }
})();
</script>
</body>
</html>
