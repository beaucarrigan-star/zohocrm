<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contracts flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Archivo:wght@500;600;700&display=swap">
<link rel="stylesheet" href="jpk.css">
<link rel="stylesheet" href="jpk-theme-v3.css">
<link rel="stylesheet" href="jpk-rail.css">
<link rel="stylesheet" href="contracts.css">
</head>
<body>
<div class="wrap">
  <header class="rec">
    <div>
      <div class="eyebrow">Contracts</div>
      <h1>Contracts flow</h1>
      <div class="muted sm" id="asof"></div>
    </div>
    <div class="actions">
      <span id="demo-flag" hidden><span class="chip info">Demo data</span></span>
      <div class="seg" id="scope" role="group" aria-label="Which contracts to show"></div>
      <label class="lead lim sm">Review limit <input type="number" id="lim" min="1" max="365" step="1" value="14" aria-label="Days a contract may wait in Needs review"> days</label>
      <button type="button" class="btn" id="refresh">Refresh</button>
      <button type="button" class="btn" id="help">How this works</button>
    </div>
  </header>

  <div id="nx"></div>

  <ol class="flow" id="flow" aria-label="Path from packet to renewal"></ol>

  <section class="card lane-card" aria-live="polite">
    <h2><span id="lane-title">Pick a step above</span><em id="lane-hint"></em></h2>
    <div id="lane-table"></div>
  </section>
  <p class="muted sm" id="foot"></p>
</div>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<script src="jpk.js"></script>
<script src="contracts-flow-model.js"></script>
<script src="demo-data.js"></script>
<script src="flow-tools.js"></script>
<script src="contracts.js"></script>
<script src="jpk-brand.js"></script>
<script src="jpk-rail.js" data-group="Contracts" data-tool="Contracts flow"></script>
<script src="jpk-intro.js"
  data-what="Follows each contract from the packet being added, through the read, the review of rate lines and clauses, the vendor cost check, to renewal. Click any step to see its contracts, and any contract to see its path."
  data-fed="Contracts, Contract Documents, Contract Clauses and Rate Lines (read-only)."
  data-feeds="Nothing (read-only). To read a packet use Contract Ingest; to verify lines and clauses use Contract Review on the contract; renewals are worked in Contracts and Customer 360."></script>
</body>
</html>
