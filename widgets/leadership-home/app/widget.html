<!DOCTYPE html>
<html lang="en">
<head>
<!-- Leadership Home v44 (S17, 20 Oct 2026). Replaces Network Home v43.1 waveC3 (rollback: Network-Home-v43.1-v3theme-waveC3-tiles.zip).
     Read-only page for the Leadership profile: six measures, each built on the same rule as a native report in the
     "Leadership measures" folder. Each measure carries a trust label (Reliable / Not yet reliable / Paused while rebuilt).
     Labels are set in MEASURES below until the weekly data check (S21) writes them. Report links stay off until
     REPORTS_LIVE is true (Beau, 20 Oct: build now, do not send reports yet). ?demo=1 shows sample numbers. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leadership Home</title>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#F4F5F7,#121417);--surface:light-dark(#FFFFFF,#191C20);--surface2:light-dark(#F7F8FA,#1F2328);
  --ink:light-dark(#1F2328,#E6E8EB);--ink2:light-dark(#3A424B,#C9CED4);--muted:light-dark(#5B6470,#9AA1AB);
  --line:light-dark(#DDE1E6,#2B3038);--line-strong:light-dark(#B8BEC7,#424955);
  --accent:light-dark(#2F55A4,#7F9FE0);--accent-ink:light-dark(#284A90,#9DB6EA);
  --bad:light-dark(#B42318,#F08A82);--warn:light-dark(#8A5300,#E0B055);--good:light-dark(#1E7A46,#5EC58C);
  --bar:light-dark(#2F55A4,#7F9FE0);--bar-w:light-dark(#C98A1A,#E0B055);--bar-r:light-dark(#B42318,#F08A82);
  --ok-tint:light-dark(#EEF8F2,#163125);--ok-line:light-dark(#9CCDB0,#2E6B4A);
  --font:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--head:Archivo,'Public Sans',system-ui,sans-serif}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
.wrap{max-width:1440px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){.wrap{padding:16px 28px 40px}}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
#nav .jpk-nav{padding:0;background:transparent}
.tools{display:flex;gap:6px}
.icon{min-height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--ink);font:500 13px var(--font);cursor:pointer}
.icon:focus-visible,.brand:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.crumb{font-size:13px;color:var(--muted)}
h1{margin:2px 0 0;font:700 24px/1.2 var(--head)}
.brands{display:flex;flex-wrap:wrap;gap:6px}
.brand{min-height:36px;padding:0 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:4px;font:500 13px var(--font);cursor:pointer}
.brand[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0;padding:0;list-style:none}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.m{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-height:220px;height:100%}
.m h2{margin:0;font:600 15px/1.3 var(--font)}
.kind{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.val{font:700 38px/1 var(--head);font-variant-numeric:tabular-nums}
.val.sm{font-size:20px;line-height:1.25}
.val.bad{color:var(--bad)}.val.mute{color:var(--muted)}
.def{font-size:12.5px;color:var(--muted)}
.foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px}
.foot a{color:var(--accent-ink);font-weight:600;text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .off{color:var(--muted)}
.trust{font-size:11px;font-weight:700;border-radius:3px;padding:2px 7px;border:1px solid var(--line-strong);color:var(--muted);background:var(--surface2)}
.why{margin:6px 0 0;font-size:12px;color:var(--muted)}
.trust.ok{color:var(--good);border-color:var(--ok-line);background:var(--ok-tint)}
.bars{display:flex;flex-direction:column;gap:6px;font-size:12.5px;margin:2px 0}
.bar{display:grid;grid-template-columns:minmax(80px,120px) 1fr 44px;gap:8px;align-items:center}
.bar .track{height:10px;border-radius:2px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--bar)}
.bar i.w{background:var(--bar-w)}.bar i.r{background:var(--bar-r)}
.bar b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.note{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 18px;font-size:13px;color:var(--ink2)}
.status{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.devs{min-height:0;height:auto}
.devs table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.devs th,.devs td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
.devs th:first-child,.devs td:first-child{text-align:left}
.devs thead th{color:var(--muted);font-weight:600;font-size:12px}
.devs tr.mfr td{font-weight:700;background:var(--surface2)}
.devs tr.fam td:first-child{padding-left:22px}
.devs tr.tot td{font-weight:700;border-top:2px solid var(--line-strong)}
.devs .tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--surface2);border:1px solid var(--line)}
@media (max-width:560px){.devs th,.devs td{padding:6px 4px}}
</style>
</head>
<body>
<div class="wrap page" id="page">
  <div class="navrow mast"><div id="nav"></div>
    <div class="tools"><button class="icon" id="refresh" type="button" aria-label="Reload the numbers" title="Reload">↻</button>
      <button class="icon" id="theme" type="button" aria-label="Theme: follow system" title="Theme">Auto</button></div></div>
  <div class="top" id="lead-top">
    <div><span id="greeting" hidden></span><div class="crumb">Home · Leadership · read-only</div><h1>How the business is doing</h1></div>
    <div class="brands" role="group" aria-label="Brand" id="brands">
      <button class="brand" type="button" data-b="all" aria-pressed="true">All brands</button>
      <button class="brand" type="button" data-b="jp" aria-pressed="false">JusticePoint</button>
      <button class="brand" type="button" data-b="sirona" aria-pressed="false">Sirona Recovery</button>
      <button class="brand" type="button" data-b="tdp" aria-pressed="false">The Difference Principle</button>
    </div>
  </div>
  <ul class="grid" id="grid" aria-live="polite"></ul>
  <section class="m devs" id="devs" aria-labelledby="h-devs"></section>
  <div class="note foot-note" id="lead-note">Every number is counted the same way as a native report in the <b>Leadership measures</b> folder. A measure shows "Not yet reliable" until its inputs pass the weekly data check (Mondays), so the page never shows a number the CRM can't back up. <span id="stamp" class="status"></span></div>
</div>
<script id="jpk-nav-js">
/* jpk-nav.js v1.0.0 (19 Oct 2026): JPK.navBar, "Back to [tab]" + "Home" buttons for widgets on record pages.
   Standalone kit file (load after jpk.js if you use it; it does not need jpk.js).
   One module-to-tab map below. Edit only the map when a tab or module changes.
   Same-window navigation: a plain <a target="_top"> link to the CRM tab URL (tested 19 Oct 2026 from a
   widget on a Canvas record page: opens in the same window; the SDK has no tab-navigation call). */
(function (root) {
  'use strict';
  var JPK = root.JPK = root.JPK || {};
  var ORG = 'https://crm.zoho.com/crm/org882980956/tab/';

  /* ---- the one map: tab label -> web tab, and which modules belong to which tab ---- */
  var TABS = {
    'Records':         { url: ORG + 'WebTab25', modules: ['Accounts', 'Deals', 'Contracts', 'Customer_Onboarding', 'Vendors'] },
    'Support Process': { url: ORG + 'WebTab26', modules: ['Cases', 'Support_Emails'] },
    'Processes':       { url: ORG + 'WebTab24', modules: ['Billing_Periods', 'Billing_Findings', 'Solicitations', 'Contract_Ingest_Tab'] }
  };
  var HOME = { label: 'Home', url: ORG + 'Home/begin' };
  /* friendly names, used for ?module= in demo mode and matching */
  var ALIAS = { 'opportunities': 'Deals', 'customer onboarding': 'Customer_Onboarding', 'support emails': 'Support_Emails',
    'billing periods': 'Billing_Periods', 'billing findings': 'Billing_Findings', 'contract ingest': 'Contract_Ingest_Tab' };

  function resolve(entity) {
    var e = String(entity || '').trim();
    if (ALIAS[e.toLowerCase()]) e = ALIAS[e.toLowerCase()];
    var low = e.toLowerCase();
    for (var label in TABS) {
      if (!Object.prototype.hasOwnProperty.call(TABS, label)) continue;
      var m = TABS[label].modules;
      for (var i = 0; i < m.length; i++) if (m[i].toLowerCase() === low) return { label: label, url: TABS[label].url, home: HOME.url, module: m[i] };
    }
    return null; /* unmapped module: caller shows Home only */
  }

  var CSS = '.jpk-nav{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin:0;padding:6px 8px;' +
    'font:500 13px var(--font,"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif);background:var(--surface,#fff);color:var(--ink,#16191D)}' +
    '.jpk-nav a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line-strong,#B8BEC7);' +
    'border-radius:var(--r-sm,3px);background:var(--surface,#fff);color:var(--ink,#16191D);text-decoration:none;font:inherit;white-space:nowrap;cursor:pointer}' +
    '.jpk-nav a:hover{background:var(--surface2,#F7F8FA)}' +
    '.jpk-nav a.back{color:var(--accent-ink,#284A90);font-weight:600;border-color:var(--accent,#2F55A4)}' +
    '.jpk-nav a:focus-visible{outline:2px solid var(--accent,#2F55A4);outline-offset:2px}' +
    '.jpk-nav svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}' +
    '@media (max-width:640px){.jpk-nav{padding:6px 8px}.jpk-nav a{height:36px;padding:0 10px}}' +
    '@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .jpk-nav{background:var(--surface,#191C20);color:var(--ink,#E6E8EB)}' +
    ':root:not([data-theme="light"]) .jpk-nav a{background:var(--surface,#191C20);color:var(--ink,#E6E8EB);border-color:var(--line-strong,#424955)}' +
    ':root:not([data-theme="light"]) .jpk-nav a:hover{background:var(--surface2,#1F2328)}' +
    ':root:not([data-theme="light"]) .jpk-nav a.back{color:var(--accent-ink,#9DB6EA);border-color:var(--accent,#7F9FE0)}}';

  function el(tag, attrs, html) {
    var n = document.createElement(tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (html) n.innerHTML = html;
    return n;
  }
  var ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
  var HOMEI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>';

  /* JPK.navBar(mount, entity) -> the resolved tab (or null). Draws "Back to <tab>" (if the module is mapped) and "Home". */
  function navBar(mount, entity) {
    if (!document.getElementById('jpk-nav-css')) {
      var st = el('style', { id: 'jpk-nav-css' }); st.textContent = CSS; document.head.appendChild(st);
    }
    var r = resolve(entity);
    var nav = el('nav', { 'class': 'jpk-nav', 'aria-label': 'Navigate' });
    if (r) nav.appendChild(el('a', { 'class': 'back', href: r.url, target: '_top', rel: 'noopener', title: 'Back to ' + r.label }, ARROW + '<span>Back to ' + r.label + '</span>'));
    nav.appendChild(el('a', { 'class': 'home', href: HOME.url, target: '_top', rel: 'noopener', title: 'Home' }, HOMEI + '<span>Home</span>'));
    mount.innerHTML = ''; mount.appendChild(nav);
    return r;
  }

  JPK.navBar = navBar; JPK.navResolve = resolve; JPK.navMap = { tabs: TABS, home: HOME };
  if (typeof module !== 'undefined' && module.exports) module.exports = { resolve: resolve, TABS: TABS, HOME: HOME };
})(typeof window !== 'undefined' ? window : this);

</script>
<script id="leadership-js">
(function () {
  'use strict';
  var BUILD = 'Leadership Home v47.0 · 23 Oct 2026';
  var ORG = 'https://crm.zoho.com/crm/org882980956/tab/';
  /* Native reports in the "Leadership measures" folder (S15). Links stay off until S15 is confirmed final. */
  var REPORTS_LIVE = true;
  var REPORTS = { renewalsAtRisk: '6715134000009404853', renewalRate: '6715134000009467002', health: '6715134000009467005',
    cases1bd: '6715134000009467023', findings: '6715134000009467011', overdueCases: '6715134000009467014', overdueTasks: '6715134000009467020' };
  /* Trust labels: built-in fallback. Since S21 (v44.2) the weekly data check writes org variable LEADERSHIP_MEASURE_TRUST
     ({at, epoch, measures:{id:{trust, why}}}); when it can be read, its labels replace these. */
  var TRUST_VAR = 'LEADERSHIP_MEASURE_TRUST', TRUST = null;
  var MEASURES = [
    { id: 'renewalsAtRisk', kind: 'Leading · renewals', title: 'Renewals at risk', trust: 'Reliable', report: 'renewalsAtRisk' },
    { id: 'renewalRate', kind: 'Outcome · retention', title: 'Renewal rate this quarter', trust: 'Not yet reliable', report: 'renewalRate' },
    { id: 'health', kind: 'Leading · customers', title: 'Customer health', trust: 'Paused while rebuilt', report: 'health' },
    { id: 'cases1bd', kind: 'Leading · service', title: 'Cases handled within 1 business day', trust: 'Not yet reliable', report: 'cases1bd' },
    { id: 'findings', kind: 'Financial · actual', title: 'Open vendor billing findings', trust: 'Reliable', report: 'findings' },
    { id: 'overdue', kind: 'Leading · workload', title: 'Overdue work by team', trust: 'Not yet reliable', report: 'overdueCases' }
  ];
  var BRANDS = { all: null, jp: ['JusticePoint EM', 'JusticePoint Programs'], sirona: ['Sirona Recovery'], tdp: ['The Difference Principle'] };
  var DEMO = /[?&](demo|ntdemo)=1/.test(location.search);
  var brand = 'all', DATA = null, ERR = {};

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function tz(d) { var o = -d.getTimezoneOffset(), s = o >= 0 ? '+' : '-'; o = Math.abs(o); return s + pad(Math.floor(o / 60)) + ':' + pad(o % 60); }
  function stampOf(d) { return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':00' + tz(d); }
  function quarter(d) { var q = Math.floor(d.getMonth() / 3); return { from: new Date(d.getFullYear(), q * 3, 1), to: new Date(d.getFullYear(), q * 3 + 3, 0), label: 'Q' + (q + 1) + ' ' + d.getFullYear() }; }
  function addBD(d, n) { var x = new Date(d.getTime()); while (n > 0) { x.setDate(x.getDate() + 1); var w = x.getDay(); if (w !== 0 && w !== 6) n--; } return x; }
  function inBrand(b) { var set = BRANDS[brand]; return !set || set.indexOf(b) > -1; }

  /* ---------- read-only data (COQL selects) ---------- */
  function withTimeout(p, ms) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timed out')); }, ms); })]); }
  function coqlAll(q) {
    var all = [];
    function page(p) {
      return withTimeout(ZOHO.CRM.API.coql({ select_query: q + ' limit 200 offset ' + (p * 200) }), 20000).then(function (r) {
        var rows = (r && r.data) || []; all = all.concat(rows); return rows.length === 200 && p < 9 ? page(p + 1) : all;
      }, function (e) { if (!e || e.status === 204 || e.code === 'NO_CONTENT' || e === '') return all; throw e; });
    }
    return page(0);
  }
  function load() {
    var now = new Date(), qtr = quarter(now), d30 = addDays(now, -30);
    var Q = {
      risk: "select id, Final_End_Date, Account.Brand from Contracts where ((Counterparty_Type = 'Customer' and Renewal_Status = 'Not started') and (Final_End_Date >= '" + ymd(now) + "' and Final_End_Date <= '" + ymd(addDays(now, 120)) + "'))",
      rate: "select id, Renewal_Status, Account.Brand from Contracts where ((Counterparty_Type = 'Customer' and Renewal_Status in ('Renewed','Not renewing')) and (Final_End_Date >= '" + ymd(qtr.from) + "' and Final_End_Date <= '" + ymd(qtr.to) + "'))",
      cases: "select id, Status, Created_Time, Modified_Time, Waiting_On, Account_Name.Brand from Cases where Created_Time >= '" + stampOf(d30) + "'",
      findings: "select id, Vendor, Age_days, Created_Time from Billing_Findings where Status in ('Open','Disputed with vendor')",
      odCases: "select id, Handling_Team, Account_Name.Brand from Cases where (Status not in ('Closed','Resolved') and Due_By < '" + stampOf(now) + "')",
      devA: "select Count_Date, On_Leg, Spare, Day_Leased_On_Leg, Day_Leased_Spare, Day_Leased_On_Leg_Ex_Sheb, Day_Leased_Spare_Ex_Sheb from Daily_Unit_Counts where ((Device_Family = 'GPS' and Acquisition = 'Purchased') and Count_Date >= '" + ymd(addDays(now, -8)) + "') order by Count_Date desc",
      devV: "select Vendor, Supplied_Through, Device_Family, SmartView_Customer, Count_Date, On_Leg, Spare from Daily_Unit_Counts where (Vendor in ('SCRAM','SuperCom') and Count_Date >= '" + ymd(addDays(now, -8)) + "') order by Count_Date desc",
      odTasks: "select id from Tasks where (Status not in ('Completed','Cancelled','Deferred') and Due_Date < '" + ymd(now) + "')"
    };
    var keys = Object.keys(Q); ERR = {};
    return Promise.all(keys.map(function (k) { return coqlAll(Q[k]).catch(function (e) { ERR[k] = (e && (e.message || e.code)) || 'could not read'; return null; }); }))
      .then(function (r) { var d = { qtr: qtr.label, now: now }; keys.forEach(function (k, i) { d[k] = r[i]; }); return d; });
  }
  function demoData() {
    var now = new Date(), B = ['JusticePoint EM', 'JusticePoint EM', 'Sirona Recovery', 'The Difference Principle'];
    function many(n, f) { var a = []; for (var i = 0; i < n; i++) a.push(f(i)); return a; }
    return { demo: true, qtr: quarter(now).label, now: now,
      risk: many(22, function (i) { return { 'Account.Brand': B[i % 4] }; }), rate: [],
      cases: many(40, function (i) { var c = addDays(now, -(i % 28) - 1); return { Status: i % 5 ? 'Closed' : 'New', Created_Time: c.toISOString(), Modified_Time: addDays(c, i % 3).toISOString(), 'Account_Name.Brand': B[i % 4] }; }),
      findings: many(185, function (i) { return { Vendor: i % 4 ? 'Allied Universal' : 'SuperCom', Age_days: i % 40 }; }),
      odCases: many(9, function (i) { return { Handling_Team: i < 7 ? 'EM Support' : 'Customer Success', 'Account_Name.Brand': B[i % 4] }; }), odTasks: many(25, function () { return {}; }),
      devA: [{ Count_Date: '2026-10-20', On_Leg: 29, Day_Leased_On_Leg: 346, Day_Leased_Spare: 60, Day_Leased_On_Leg_Ex_Sheb: 192 }],
      devV: [{ Vendor: 'SCRAM', Supplied_Through: 'Allied', Device_Family: 'Remote Breath', SmartView_Customer: 'SCRAM | Ramsey County Pretrial', Count_Date: '2026-10-20', On_Leg: 158, Spare: 80 },
        { Vendor: 'SCRAM', Supplied_Through: 'Direct', Device_Family: 'CAM', SmartView_Customer: 'SCRAM | Racine County', Count_Date: '2026-10-20', On_Leg: 43, Spare: 17 },
        { Vendor: 'SCRAM', Supplied_Through: 'Direct', Device_Family: 'CAM', SmartView_Customer: 'SCRAM | Sheboygan Sheriff Pretrial', Count_Date: '2026-10-20', On_Leg: 6, Spare: 1 },
        { Vendor: 'SuperCom', Supplied_Through: 'Direct', Device_Family: 'GPS', SmartView_Customer: 'SuperCom | Iowa County (WI)', Count_Date: '2026-10-20', On_Leg: 0, Spare: 4 }] };
  }

  /* ---------- measures ---------- */
  function bars(list, max, label) {
    max = Math.max(max, 1);
    return '<div class="bars" role="img" aria-label="' + esc(label + ': ' + list.map(function (b) { return b[0] + ' ' + b[1]; }).join(', ')) + '">' + list.map(function (b) {
      return '<div class="bar" aria-hidden="true"><span>' + esc(b[0]) + '</span><span class="track"><i class="' + (b[2] || '') + '" style="width:' + Math.round(b[1] / max * 100) + '%"></i></span><b>' + b[1] + '</b></div>';
    }).join('') + '</div>';
  }
  function body(m, d) {
    function miss(k) { return d[k] === null ? '<p class="err">Could not read this from Zoho (' + esc(ERR[k] || '') + ').</p>' : ''; }
    if (m.id === 'renewalsAtRisk') {
      if (d.risk === null) return miss('risk');
      var n = d.risk.filter(function (r) { return inBrand(r['Account.Brand']); }).length;
      return '<span class="val' + (n ? ' bad' : '') + '">' + n + '</span><span class="def">Customer contracts ending in 120 days with the renewal not started. Target 0.</span>';
    }
    if (m.id === 'renewalRate') {
      if (d.rate === null) return miss('rate');

    order.forEach(function (m) {

      h += '<tr class="mfr"><td>' + esc(m) + '</td><td>' + s.on + '</td><td>' + s.onX + '</td><td>' + s.sp + '</td><td>' + (s.on + s.sp) + '</td></tr>';

/* jpk-shell.css v0.2.1 (S24 v6.0.3, 22 Oct 2026): the page frame for Beau CS Home, in line with Beau's mockup. Pairs with jpk-shell.js.

   Every rule is scoped under html[data-jpk-shell="on"], so with the shell off this file has no effect (one exception: the footer
   switch link, which also shows when the shell is off). Colours, spacing and type come from the page's tokens (--surface, --line,
   --muted, --accent, --sp-*, --fs-*); nothing is redefined. New values are jpk- custom properties. Rounded corners and gaps are

  --jpk-dark-ink: #F3F5F7; --jpk-dark-muted: #B9C0CA; --jpk-dark-line: rgba(255, 255, 255, .22);

    });

    html.setAttribute('data-s32', 'on');
    gearButton(wrap.querySelector('.s32-bar'));
    return W;
  }
  function blockHtml(t, now) {
    var ev = t.ev, linked = !!(ev.accountId || ev.contactId), past = t.e <= now, live = t.s <= now && t.e > now;
    var joinOn = !!ev.joinUrl && t.e > now && (t.s - now) <= JOIN_MIN * 60000;
    var short = t.height < 34, pv = provider(ev);
    var when = hm(t.s) + (t.e > t.s ? ' to ' + hm(t.e) : '');
    var samePm = (t.s.getHours() < 12) === (t.e.getHours() < 12) && ymd(t.s) === ymd(t.e);
    var meta = (t.e > t.s ? (samePm ? hm2(t.s) : hm(t.s)) + ' – ' + hm(t.e) : hm(t.s)) + (pv ? ' · ' + pv : '');
    var w = 100 / t.cols, open = canOpen();
    var link = linked ? (ev.accountName || ev.contactName || 'Linked') : 'Not linked';
    var label = (ev.title || '(no title)') + ', ' + when + (pv ? ', ' + pv : '') + ', ' + link + (past ? ', over' : live ? ', happening now' : '');
    return '<div role="listitem" class="s32-ev ' + (linked ? 's32-linked' : 's32-unlinked') + (past ? ' s32-past' : '') + (live ? ' s32-live' : '') + (short ? ' s32-short' : '') + (joinOn ? (t.cols > 1 ? ' s32-hasjoin-i' : ' s32-hasjoin') : '') + '"'
      + ' style="top:' + t.top.toFixed(1) + 'px;height:' + t.height.toFixed(1) + 'px;left:calc(' + (t.col * w).toFixed(3) + '% + 1px);width:calc(' + w.toFixed(3) + '% - 3px)"'
      + (open ? ' data-jpk-open="' + esc(ev.id) + '" data-jpk-at="' + t.s.getTime() + '" tabindex="0" aria-label="' + esc(label + '. Open details') + '"' : ' aria-label="' + esc(label) + '"')
      + ' title="' + esc((ev.title || '(no title)') + '\n' + when + (pv ? ' · ' + pv : '') + '\n' + link) + '">'
      + '<span class="s32-t">' + esc(ev.title || '(no title)') + '</span>'
      + (short ? (t.cols > 1 ? '' : '<span class="s32-m">' + esc(hm(t.s)) + '</span>') : '<span class="s32-m">' + esc(meta) + '</span>')
 + (joinOn ? '<a class="s32-join' + (t.cols > 1 ? ' s32-join-i' : '') + '" href="' + esc(ev.joinUrl) + '" target="_blank" rel="noopener" aria-label="Join ' + esc(ev.title || 'meeting') + ' (opens in a new tab)">' + (t.cols > 1 ? '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1z"/><path d="M10.5 7l3-2v6l-3-2"/></svg>' : 'Join') + '</a>' : '')
      + '</div>';
  }
  function render(force) {
    var S = calState(); if (!S) return;
    var w = ensure(); if (!w) return;
    var now = new Date(), day = S.day || ymd(now), isToday = day === ymd(now), rg = hours();
    var st = S.status;
    if (st !== 'ok') {   /* loading or failed: the shell's own message shows instead of the grid */
      html.setAttribute('data-s32-grid', 'off');
      lastSig = ''; return;
    }
    var L = layout(S.events, day, rg);
    var sig = [day, now.getHours(), now.getMinutes(), rg.s, rg.e, JSON.stringify(L.timed.map(function (t) { var e = t.ev; return [e.id, e.start, e.end, e.title, !!e.accountId, !!e.contactId, e.accountName, e.contactName, e.joinUrl, e.venue]; })), L.allDay.map(function (e) { return e.id + (e.accountId || e.contactId ? '+' : ''); }).join(',')].join('|');
    html.setAttribute('data-s32-grid', 'on');
    if (day !== lastDay || force === 'scroll') { lastDay = day; pendingScroll = true; }
    if (!force && sig === lastSig) { scrollIfDue(w, L, rg, isToday, now); return; }
    lastSig = sig;
    var keepFocus = doc.activeElement && w.root.contains(doc.activeElement) ? doc.activeElement.getAttribute('data-jpk-open') : null;

    /* all-day strip */
    if (L.allDay.length) {
      w.all.hidden = false;
      w.all.innerHTML = '<span class="s32-ad-k">All day</span>' + L.allDay.map(function (ev) {
        var linked = !!(ev.accountId || ev.contactId);
        return '<span class="s32-ad ' + (linked ? 's32-linked' : 's32-unlinked') + '"' + (canOpen() ? ' data-jpk-open="' + esc(ev.id) + '" data-jpk-at="' + toDate(ev.start).getTime() + '" role="button" tabindex="0"' : '') + ' title="' + esc(ev.title) + '">' + esc(ev.title || '(no title)') + '</span>';
      }).join('');
    } else { w.all.hidden = true; w.all.innerHTML = ''; }

    /* grid */
    var hrs = '', h;
    for (h = L.from / 60; h <= L.to / 60; h++) {
      var y = (h * 60 - L.from) / 60 * HPX;
      hrs += '<div class="s32-hr' + (h === L.to / 60 ? ' s32-hr-last' : '') + '" style="top:' + y + 'px" aria-hidden="true">' + (h < L.to / 60 ? '<span>' + hourLabel(h) + '</span>' : '') + '</div>';
      if (h < L.to / 60) hrs += '<div class="s32-half" style="top:' + (y + HPX / 2) + 'px" aria-hidden="true"></div>';
    }
    var nowLine = '';
    var nm = now.getHours() * 60 + now.getMinutes();
    if (isToday && nm >= L.from && nm <= L.to) nowLine = '<div class="s32-now" style="top:' + ((nm - L.from) / 60 * HPX) + 'px" role="presentation" aria-hidden="true"><b>' + esc(hm(now)) + '</b></div>';
    var gridH = (L.to - L.from) / 60 * HPX;
    w.grid.style.height = gridH + 'px';

    w.grid.setAttribute('aria-label', (isToday ? 'Today' : new Date(day + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })) + ': ' + L.timed.length + (L.timed.length === 1 ? ' meeting' : ' meetings') + ' on the time grid');

    /* the visible window is the person's day range; the grid scrolls for anything outside it */
    var viewH = (rg.e - rg.s) * HPX + 8;
    w.sc.style.maxHeight = Math.min(viewH, gridH + 8) + 'px';
    w.empty.hidden = !!(L.timed.length || L.allDay.length);
    if (!w.empty.hidden) w.empty.textContent = isToday ? 'No meetings today.' : 'Nothing on this day.';

    scrollIfDue(w, L, rg, isToday, now);
    if (keepFocus) { var f = w.root.querySelector('[data-jpk-open="' + keepFocus + '"]'); if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} } }
  }

  /* scroll on a new day, the first draw or a new range: to now (today) or the first meeting, else the start of the range.
     Waits while the calendar is collapsed or the week is hidden (no height yet), so opening it later still lands on now. */
  function scrollIfDue(w, L, rg, isToday, now) {
    if (!pendingScroll || !w.sc.clientHeight) return;
    pendingScroll = false; userScrolled = false;
    var nm = now.getHours() * 60 + now.getMinutes(), target;
    if (isToday && nm >= L.from && nm <= L.to) target = (nm - L.from) / 60 * HPX - HPX * 1.25;
    else if (L.timed.length && (L.timed[0].sm < rg.s * 60 || L.timed[0].sm > rg.e * 60 - 60)) target = L.timed[0].top - HPX / 2;
    else target = (rg.s * 60 - L.from) / 60 * HPX;
    w.sc.__auto = true; w.sc.scrollTop = Math.max(0, target);
  }

  /* ---------- day range setting ---------- */
  var G = null;
  function gearText() { var r = hours(); return hourLabel(r.s) + ' to ' + hourLabel(r.e); }
  function gearButton(nav) {
    if (!nav || nav.querySelector('.s32-gear')) return;
    var b = doc.createElement('button');
    b.type = 'button'; b.className = 's32-gear'; b.title = 'Change the hours the calendar shows'; b.setAttribute('aria-haspopup', 'dialog'); b.setAttribute('aria-expanded', 'false');
    b.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2.2 1.4"/></svg><span class="s32-gear-t"></span>';
    b.querySelector('.s32-gear-t').textContent = gearText();
    b.setAttribute('aria-label', 'Day range ' + gearText() + '. Change');
    nav.appendChild(b);
    b.addEventListener('click', function (e) { e.stopPropagation(); if (G) closeGear(true); else openGear(b); });
  }
  function opts(sel, from, to) { var o = ''; for (var h = from; h <= to; h++) o += '<option value="' + h + '"' + (h === sel ? ' selected' : '') + '>' + hourLabel(h) + '</option>'; return o; }
  function openGear(b) {
    var cal = doc.getElementById('jpk-cal'); if (!cal) return;
    var rg = hours(), p = doc.createElement('div');
    p.className = 's32-pop'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Day range');
    p.innerHTML = '<p class="s32-pop-h">Day range</p>'
      + '<div class="s32-pop-row"><label for="s32-hs">Start</label><select id="s32-hs">' + opts(rg.s, 0, 23) + '</select></div>'
      + '<div class="s32-pop-row"><label for="s32-he">End</label><select id="s32-he">' + opts(rg.e, 1, 24) + '</select></div>'
      + '<p class="s32-pop-n" aria-live="polite">Meetings outside these hours still show. Saved in this browser.</p>'
      + '<div class="s32-pop-a"><button type="button" class="jpk-btn jpk-primary" data-s32="save">Save</button><button type="button" class="jpk-btn" data-s32="reset">7 AM to 6 PM</button></div>';
    var bar = cal.querySelector('.s32-bar'); if (!bar) return;
    bar.parentNode.insertBefore(p, bar.nextSibling);

    var hs = p.querySelector('#s32-hs'), he = p.querySelector('#s32-he'), note = p.querySelector('.s32-pop-n');
    var check = function () { var ok = +he.value > +hs.value; note.textContent = ok ? 'Meetings outside these hours still show. Saved in this browser.' : 'End must be after start.'; note.classList.toggle('s32-bad', !ok); p.querySelector('[data-s32="save"]').disabled = !ok; return ok; };
    hs.addEventListener('change', check); he.addEventListener('change', check);
    p.addEventListener('click', function (e) {
      e.stopPropagation();
      var a = e.target.closest && e.target.closest('[data-s32]'); if (!a) return;
      if (a.getAttribute('data-s32') === 'save') { if (!check()) return; saveHours({ s: +hs.value, e: +he.value }); }
      else saveHours(null);
      closeGear(true); var t = b.querySelector('.s32-gear-t'); if (t) t.textContent = gearText(); b.setAttribute('aria-label', 'Day range ' + gearText() + '. Change'); render('scroll');
    });
    p.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeGear(true); } });
    try { hs.focus(); } catch (e) {}
  }
  function closeGear(focus) {
    if (!G) return;
    var g = G; G = null;
    if (g.p.parentNode) g.p.parentNode.removeChild(g.p);
    g.b.setAttribute('aria-expanded', 'false');
    if (focus) { try { g.b.focus(); } catch (e) {} }
  }
  doc.addEventListener('click', function (e) { if (G && !G.p.contains(e.target) && e.target !== G.b) closeGear(false); });

  /* ---------- the details panel as a side panel ---------- */
  var scrim = null;
  function placePanel() {
    var v = typeof root.hlViewport === 'function' ? root.hlViewport() : null;
    var top = v && v.known ? v.top : 0, h = v && v.known ? v.h : root.innerHeight;

    html.style.setProperty('--s32-h', Math.round(h) + 'px');
  }
  function syncPanel() {

      scrim = doc.createElement('div'); scrim.className = 's32-scrim'; scrim.hidden = true; scrim.setAttribute('aria-hidden', 'true');

  /* ---------- wiring ---------- */
  var t = 0;
  function soon() { clearTimeout(t); t = setTimeout(function () { render(false); syncPanel(); }, 60); }

    var tries = 0;
    (function wait() {
      if (calState() && doc.getElementById('jpk-cal')) {
