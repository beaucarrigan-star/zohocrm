<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock and accessories flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Archivo:wght@500;600;700&display=swap">
<link rel="stylesheet" href="jpk.css">
<link rel="stylesheet" href="jpk-theme-v3.css">
<link rel="stylesheet" href="jpk-rail.css">
<link rel="stylesheet" href="stock.css">
<link rel="stylesheet" href="flow-v3.css">
</head>
<body>
<div class="wrap">
  <header class="rec">
    <div>
      <div class="eyebrow">Stock and accessories</div>
      <h1>Stock and accessories flow</h1>
      <div class="muted sm" id="asof"></div>
    </div>
    <div class="actions">
      <span id="demo-flag" hidden><span class="chip info">Demo data</span></span>
      <div class="seg" id="win" role="group" aria-label="Time window for received and closed items"></div>
      <button type="button" class="btn" id="refresh">Refresh</button>
      <button type="button" class="btn" id="help">How this works</button>
    </div>
  </header>

  <div id="nx"></div>

  <ol class="flow" id="flow" aria-label="Path from signal to closed"></ol>

  <section class="card lane-card" aria-live="polite">
    <h2><span id="lane-title">Pick a step above</span><em id="lane-hint"></em></h2>
    <div id="lane-table"></div>
  </section>
  <p class="muted sm" id="foot"></p>
</div>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<script src="jpk.js"></script>
<script src="triage-model.js"></script>
<script src="stock-flow-model.js"></script>
<script src="demo-data.js"></script>
<script src="flow-tools.js"></script>
<script src="stock.js"></script>
<script src="jpk-brand.js"></script>
<script src="jpk-rail.js" data-group="Equipment" data-tool="Stock flow"></script>
<script src="jpk-intro.js"
  data-what="Follows each stock alert and accessory recommendation to what was done about it: an order, a return request, or a follow-up with the customer. Click any step to see its records, and any record to see its path."
  data-fed="Stock Alerts (EM Stock Alerts), Accessory Order Recommendations, Vendor Orders, Accessory Shipments and (once it exists) Device Returns."
  data-feeds="Nothing (read-only). To approve or send an alert use Stock Alerts; to order or contact use the Accessory Board and the Order area."></script>
</body>
</html>
