<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pricing flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Archivo:wght@500;600;700&display=swap">
<link rel="stylesheet" href="jpk.css">
<link rel="stylesheet" href="jpk-theme-v3.css">
<link rel="stylesheet" href="jpk-rail.css">
<link rel="stylesheet" href="pricing.css">
</head>
<body>
<div class="wrap">
  <header class="rec">
    <div>
      <div class="eyebrow">Pricing</div>
      <h1>Pricing flow</h1>
      <div class="muted sm" id="asof"></div>
    </div>
    <div class="actions">
      <span id="demo-flag" hidden><span class="chip info">Demo data</span></span>
      <button type="button" class="btn" id="refresh">Refresh</button>
      <button type="button" class="btn" id="help">How this works</button>
    </div>
  </header>
  <div class="limits sm">
    <label class="lead lim">Rate age <input type="number" id="lim-rate" min="1" max="1000" step="1" value="90" aria-label="Days before a vendor rate counts as old"> days</label>
    <label class="lead lim">Draft age <input type="number" id="lim-draft" min="1" max="1000" step="1" value="30" aria-label="Days before an untouched draft counts as old"> days</label>
    <label class="lead lim">Margin gap <input type="number" id="lim-gap" min="1" max="100" step="1" value="5" aria-label="Percentage points between actual and modelled margin"> points</label>
  </div>

  <div id="nx" style="margin-top:12px"></div>

  <ol class="flow" id="flow" aria-label="Path from pricing inputs to decision"></ol>

  <section class="card lane-card" aria-live="polite">
    <h2><span id="lane-title">Pick a step above</span><em id="lane-hint"></em></h2>
    <div id="lane-table"></div>
  </section>
  <p class="muted sm" id="foot"></p>
</div>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<script src="jpk.js"></script>
<script src="pricing-flow-model.js"></script>
<script src="demo-data.js"></script>
<script src="flow-tools.js"></script>
<script src="pricing.js"></script>
<script src="jpk-brand.js"></script>
<script src="jpk-rail.js" data-group="Pricing" data-tool="Pricing flow"></script>
<script src="jpk-intro.js"
  data-what="Follows pricing from its inputs (vendor costs, vendor rates, verified customer rates) through pricing scenarios and their saved margin rows, to billing actuals and the decision. Click any step to see its records."
  data-fed="Products, Vendor Rates, Contracts and Rate Lines, Pricing Scenarios and EM Margin (read-only). Billing runs write the actuals."
  data-feeds="Nothing (read-only). To price a customer use EM Pricing Studio; to verify rates use Contract Review."></script>
</body>
</html>
