<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your work today</title>
<meta name="jpk-build" content="Your Work Today tab (S42: guide line on jpk-intro v1.1.0, 28 Oct 2026)">
<meta name="color-scheme" content="light dark">
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>:root{color-scheme:light dark}body{margin:0;padding:16px;background:light-dark(#F7F8FA,#101214);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
#work-today{margin:0}</style>
<style id="work-today-css">
/* Work today: scoped to #work-today so it cannot change the host page. Graphite + cobalt v3 tokens, redefined inside the scope with light-dark()
   (the home pages already set color-scheme on :root and data-theme for the Light/Dark choice). */
#work-today{
  --surface:light-dark(#FFFFFF,#191C20);--surface2:light-dark(#F7F8FA,#1F2328);--ink:light-dark(#16191D,#E6E8EB);--muted:light-dark(#5F6670,#9AA1AB);
  --line:light-dark(#DCE0E5,#2B3038);--line-strong:light-dark(#B8BEC7,#424955);--accent:light-dark(#2F55A4,#7F9FE0);--accent-ink:light-dark(#284A90,#9DB6EA);
  --accent-soft:light-dark(#E6ECF8,#1E2A45);--on-accent:light-dark(#FFFFFF,#0C1424);--good:light-dark(#1F6F45,#5EC58C);--warn:light-dark(#8A6412,#E0B055);
  --bad:light-dark(#A33A33,#F08A82);--info:light-dark(#4A6B8A,#8DAAC6);--font:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--r:4px;
  margin:0 0 16px;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45
}
#work-today[hidden]{display:none}
#work-today *{box-sizing:border-box}
#work-today .wt-load,#work-today .wt-note{margin:0;padding:10px 14px;color:var(--muted);font-size:12.5px}
#work-today .wt-note{border-left:3px solid var(--warn);background:var(--surface2);margin-top:8px;border-radius:var(--r)}
#work-today .jp-wl{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);min-height:440px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#work-today .jp-wl [hidden]{display:none!important}
#work-today .jp-wl-list{border-right:1px solid var(--line);min-width:0}
#work-today .jp-wl-hd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#work-today .jp-wl-hd h3{margin:0;font-size:18px}
#work-today .jp-wl-hd p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
#work-today .jp-wl-gh{font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 16px 6px;background:var(--surface2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#work-today .jp-wi{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;padding:10px 16px;min-height:44px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
#work-today .jp-wi:hover{background:var(--surface2)}
#work-today .jp-wi[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
#work-today .jp-wi:focus-visible,#work-today .btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#work-today .jp-wi .dot{width:7px;height:7px;border-radius:99px;background:var(--line-strong);margin-top:6px}
#work-today .jp-wi .dot.bad{background:var(--bad)}#work-today .jp-wi .dot.warn{background:var(--warn)}#work-today .jp-wi .dot.good{background:var(--good)}#work-today .jp-wi .dot.info{background:var(--info)}
#work-today .jp-wi .tx{min-width:0}
#work-today .jp-wi b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#work-today .jp-wi small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#work-today .jp-wi em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
#work-today .jp-wi em.soon{color:var(--warn);font-weight:600}
#work-today .jp-wl-focus{padding:18px 22px;display:grid;gap:14px;align-content:start;min-width:0}
#work-today .jp-wl-focus h3{margin:0;font-size:20px}
#work-today .jp-wl .empty{padding:18px 16px;color:var(--muted)}
#work-today .jp-wl .empty b{display:block;color:var(--ink);margin-bottom:2px}
#work-today .jp-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r)}
#work-today .jp-facts>div{padding:8px 12px;border-right:1px solid var(--line);min-width:0}
#work-today .jp-facts>div:last-child{border-right:0}
#work-today .jp-facts small{display:block;font:500 11.5px var(--font);color:var(--muted)}
#work-today .jp-facts b{display:block;font-size:13px;overflow-wrap:anywhere}
#work-today .jp-nextbox{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:10px 14px;background:var(--surface)}
#work-today .jp-nextbox small{font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#work-today .jp-nextbox p{margin:3px 0 10px}
#work-today .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 12px;font:600 13px var(--font);cursor:pointer}
#work-today .btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#work-today .jp-why{margin:0;display:grid;gap:6px;font-size:13px}
#work-today .jp-why div{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:10px}
#work-today .jp-why dt{color:var(--muted)}
#work-today .jp-why dd{margin:0}
@media (max-width:820px){#work-today .jp-wl{grid-template-columns:1fr}#work-today .jp-wl-list{border-right:0;border-bottom:1px solid var(--line)}}
@media (max-width:560px){#work-today .jp-facts{grid-template-columns:1fr 1fr}#work-today .jp-why div{grid-template-columns:1fr;gap:0}}
@media (max-width:700px){#work-today .jp-wi{min-height:48px}#work-today .btn{min-height:44px}}
/* Wide screens: the list scrolls inside its own column and the detail panel stays put. Fixed-height box, so it works whether or not Zoho sizes the frame to its content. */
@media (min-width:821px){#work-today .jp-wl{height:clamp(440px,calc(100vh - 32px),720px)}#work-today .jp-wl-list{overflow-y:auto;min-height:0}#work-today .jp-wl-focus{overflow-y:auto;min-height:0}}
</style></head><body>
<section id="work-today" aria-label="Your work today" data-teams="*" data-default-team="1" data-queue-profiles="Administrator,System Support" hidden><div id="wt-mount"></div><p id="wt-note" class="wt-note" role="status" hidden></p></section>

<script id="work-today-js">
/* JusticePoint widget kit: jpk.js v1.2.1. One IIFE, exposes window.JPK. No dependencies, no network, no AI calls.
   Works standalone in a browser; JPK.crm is guarded so the Zoho SDK is optional.
   Changes from kit v1.0.0 (kit.js): JPK.zoho -> JPK.crm (fn -> run; coql added; coqlAll pages over coql),
   JPK.nextStep -> JPK.next, JPK.about -> JPK.aboutButton. No aliases: an old call fails loudly.
   Changes in v1.2.1: JPK.workList opens items from the unassigned group too (they were listed but did nothing when picked).
   Changes in v1.2.0 (wave A patterns, all default off; load jpk-patterns-v3.css after jpk-theme-v3.css):
   JPK.table gains options select, expand, cards; new JPK.workList, ownerStrip, roleList, taskList, checkAnswers, field,
   errorSummary; pure logic is exposed as JPK.model so it can be tested without a browser. Nothing here writes to Zoho:
   every action is a callback the widget supplies. */
(function () {
  'use strict';

  /* In node (model tests) there is no DOM: a stub keeps the module-level listeners harmless. */
  var doc = typeof document !== 'undefined' ? document : { addEventListener: function () {}, querySelector: function () { return null; } };
  var uidN = 0;
  function uid(p) { uidN += 1; return (p || 'jpk') + '-' + uidN; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function el(target) {
    if (!target) return null;
    return typeof target === 'string' ? doc.querySelector(target) : target;
  }
  function reduced() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; }
  }
  function toNode(x) {
    if (x && x.nodeType) return x;
    var t = doc.createElement('template');
    t.innerHTML = String(x == null ? '' : x);
    return t.content;
  }
  var FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  function focusables(root) {
    return Array.prototype.slice.call(root.querySelectorAll(FOCUSABLE)).filter(function (n) {
      return !n.hidden && n.offsetParent !== null || n === doc.activeElement;
    });
  }

  /* ---------------- toast ---------------- */
  var toastEl = null, toastT = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = doc.createElement('div');
      toastEl.id = 'jpk-toast';
      toastEl.setAttribute('role', 'status');
      toastEl.setAttribute('aria-live', 'polite');
      doc.body.appendChild(toastEl);
    }
    toastEl.textContent = String(msg);
    toastEl.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 2800);
  }

  /* ---------------- drawer ---------------- */
  var dr = null, lastFocus = null;
  function buildDrawer() {
    var root = doc.createElement('div');
    root.className = 'jpk-dr';
    root.hidden = true;
    root.innerHTML = '<div class="scrim"></div>' +
      '<aside role="dialog" aria-modal="true" aria-labelledby="jpk-dr-t" tabindex="-1">' +
      '<header><h3 id="jpk-dr-t"></h3><button type="button" class="iconbtn" id="jpk-dr-x" aria-label="Close">&times;</button></header>' +
      '<div class="jpk-dr-b"></div></aside>';
    doc.body.appendChild(root);
    dr = {
      root: root,
      aside: root.querySelector('aside'),
      title: root.querySelector('#jpk-dr-t'),
      body: root.querySelector('.jpk-dr-b'),
      x: root.querySelector('#jpk-dr-x')
    };
    dr.x.addEventListener('click', closeDrawer);
    root.querySelector('.scrim').addEventListener('click', closeDrawer);
    doc.addEventListener('keydown', function (e) {
      if (!dr || dr.root.hidden) return;
      if (e.key === 'Escape') { e.preventDefault(); closeDrawer(); return; }
      if (e.key === 'Tab') {
        var f = focusables(dr.aside);
        if (!f.length) { e.preventDefault(); return; }
        var first = f[0], last = f[f.length - 1], a = doc.activeElement;
        if (!dr.aside.contains(a)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
      }
    });
    doc.addEventListener('focusin', function (e) {
      if (dr && !dr.root.hidden && !dr.aside.contains(e.target)) dr.x.focus();
    });
  }
  function openDrawer(o) {
    o = o || {};
    if (!dr) buildDrawer();
    if (dr.root.hidden) lastFocus = doc.activeElement;
    dr.title.textContent = o.title || '';
    dr.body.innerHTML = '';
    if (o.node) dr.body.appendChild(o.node);
    else dr.body.appendChild(toNode(o.html));
    dr.root.hidden = false;
    dr.aside.scrollTop = 0;
    dr.x.focus();
    if (typeof o.onMount === 'function') o.onMount(dr.body);
    return dr.body;
  }
  function closeDrawer() {
    if (!dr || dr.root.hidden) return;
    dr.root.hidden = true;
    dr.body.innerHTML = '';
    var f = lastFocus; lastFocus = null;
    if (f && f.focus && doc.contains(f)) { try { f.focus(); } catch (e) { /* ignore */ } }
  }
  var drawer = { open: openDrawer, close: closeDrawer, isOpen: function () { return !!dr && !dr.root.hidden; } };

  /* ---------------- chip ---------------- */
  var TONES = { good: 1, warn: 1, bad: 1, info: 1, neutral: 1 };
  function chip(text, tone) {
    var t = TONES[tone] && tone !== 'neutral' ? ' ' + tone : '';
    return '<span class="chip' + t + '">' + esc(text) + '</span>';
  }
  chip.el = function (text, tone) {
    var t = doc.createElement('template');
    t.innerHTML = chip(text, tone);
    return t.content.firstChild;
  };

  /* ---------------- flash ---------------- */
  function flash(node) {
    node = el(node);
    if (!node || reduced()) return;
    node.classList.remove('flash');
    void node.offsetWidth;
    node.classList.add('flash');
  }

  /* ---------------- table ---------------- */
  function table(o) {
    var mount = el(o.mount);
    var cols = o.columns || [];
    var filters = (o.filters || []).slice();
    var hasAll = filters.some(function (f) { return f.key === 'all'; });
    if (filters.length && !hasAll) filters.unshift({ key: 'all', label: 'All', test: function () { return true; } });
    var state = { rows: (o.rows || []).slice(), sortKey: null, dir: 1, filter: o.filter || (filters.length ? filters[0].key : null) };
    var empty = o.empty || { title: 'Nothing here', hint: '' };
    /* v1.2.0 options, all off unless asked for. select.allowed must be true (the widget passes the Admin check). */
    var sel = o.select && o.select.allowed ? o.select : null;
    var exp = typeof o.expand === 'function' ? o.expand : null;
    var picked = {}, opened = {}, lastList = [];
    function keyOf(r, i) { return sel && sel.rowId ? String(sel.rowId(r)) : String(i); }
    function narrow() { try { return !!(window.matchMedia && window.matchMedia('(max-width:700px)').matches); } catch (e) { return false; } }

    mount.innerHTML = '';
    var pills = null;
    if (filters.length) {
      pills = doc.createElement('div');
      pills.className = 'row';
      pills.style.marginBottom = '10px';
      pills.setAttribute('role', 'group');
      pills.setAttribute('aria-label', o.filterLabel || 'Filter');
      mount.appendChild(pills);
      pills.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-f]');
        if (b) setFilter(b.getAttribute('data-f'));
      });
    }
    var bar = null;
    if (sel) {
      bar = doc.createElement('div'); bar.className = 'jp-batch'; bar.hidden = true;
      bar.setAttribute('role', 'region'); bar.setAttribute('aria-label', 'Actions for selected rows');
      bar.innerHTML = '<b class="jp-count" aria-live="polite"></b><span class="jp-sum"></span><span class="jp-acts"></span><button type="button" class="btn sm jp-cancel">Cancel</button>';
      mount.appendChild(bar);
      var acts = bar.querySelector('.jp-acts');
      (sel.actions || []).forEach(function (a, ai) {
        var b = doc.createElement('button'); b.type = 'button'; b.className = 'btn sm'; b.textContent = a.label; b.setAttribute('data-act', ai);
        acts.appendChild(b);
      });
      bar.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.classList.contains('jp-cancel')) { clearSel(); return; }
        var ai = b.getAttribute('data-act');
        if (ai != null && sel.actions[+ai] && typeof sel.actions[+ai].onClick === 'function') sel.actions[+ai].onClick(selectedRows(), api);
      });
    }
    var tw = doc.createElement('div'); tw.className = 'tw'; mount.appendChild(tw);
    var emptyEl = doc.createElement('div'); emptyEl.className = 'empty'; emptyEl.hidden = true; mount.appendChild(emptyEl);

    var tbl = doc.createElement('table');
    if (o.cards) tbl.className = 'jp-cards';
    if (o.caption) { var cap = doc.createElement('caption'); cap.className = 'sr'; cap.textContent = o.caption; tbl.appendChild(cap); }
    var thead = doc.createElement('thead'), tbody = doc.createElement('tbody');
    tbl.appendChild(thead); tbl.appendChild(tbody); tw.appendChild(tbl);

    var tr = doc.createElement('tr');
    if (sel) {
      var thc = doc.createElement('th'); thc.className = 'jp-cb'; thc.scope = 'col';
      thc.innerHTML = '<label class="jp-ck"><input type="checkbox" class="ck jp-all" aria-label="Select all rows"><span class="jp-allt" aria-hidden="true">Select all</span></label>';
      tr.appendChild(thc);
    }
    if (exp) {
      var thx = doc.createElement('th'); thx.className = 'jp-cx'; thx.scope = 'col';
      thx.innerHTML = '<span class="sr">Details</span>';
      tr.appendChild(thx);
    }
    cols.forEach(function (c) {
      var th = doc.createElement('th');
      th.scope = 'col';
      var cls = [];
      if (c.align === 'right') cls.push('r'); else if (c.align === 'center') cls.push('c');
      if (c.sortable) { cls.push('sort'); th.setAttribute('aria-sort', 'none'); }
      th.className = cls.join(' ');
      th.setAttribute('data-k', c.key);
      if (c.sortable) {
        var b = doc.createElement('button'); b.type = 'button'; b.textContent = c.label; th.appendChild(b);
      } else th.textContent = c.label;
      tr.appendChild(th);
    });
    thead.appendChild(tr);
    thead.addEventListener('change', function (e) {
      if (!e.target.classList.contains('jp-all')) return;
      lastList.forEach(function (x) { if (e.target.checked) picked[keyOf(x.r, x.i)] = true; else delete picked[keyOf(x.r, x.i)]; });
      render();
    });
    thead.addEventListener('click', function (e) {
      var th = e.target.closest('th.sort');
      if (!th) return;
      var k = th.getAttribute('data-k');
      state.dir = state.sortKey === k ? -state.dir : 1;
      state.sortKey = k;
      render();
      var again = thead.querySelector('th[data-k="' + k + '"] button');
      if (again) again.focus();
    });

    function colFor(k) { for (var i = 0; i < cols.length; i++) if (cols[i].key === k) return cols[i]; return null; }
    function val(c, row) { return c.sortValue ? c.sortValue(row) : row[c.key]; }
    function visibleRows() {
      var f = null;
      for (var i = 0; i < filters.length; i++) if (filters[i].key === state.filter) f = filters[i];
      var list = state.rows.map(function (r, i) { return { r: r, i: i }; });
      if (f && f.test) list = list.filter(function (x) { return f.test(x.r); });
      if (state.sortKey) {
        var c = colFor(state.sortKey), d = state.dir;
        list.sort(function (a, b) {
          var x = val(c, a.r), y = val(c, b.r);
          if (x == null && y == null) return 0;
          if (x == null) return 1;
          if (y == null) return -1;
          if (typeof x === 'number' && typeof y === 'number') return d * (x - y);
          return d * String(x).localeCompare(String(y), undefined, { numeric: true });
        });
      }
      return list;
    }
    function cell(c, row) {
      var td = doc.createElement('td');
      var cls = [];
      if (c.align === 'right') cls.push('r'); else if (c.align === 'center') cls.push('c');
      if (c.num) cls.push('num');
      td.className = cls.join(' ');
      if (o.cards) { td.setAttribute('data-label', c.label); if (c.primary) td.className += ' jp-pri'; if (c.full) td.className += ' jp-full'; }
      var v = c.render ? c.render(row) : esc(row[c.key]);
      if (v && v.nodeType) td.appendChild(v); else td.innerHTML = v == null ? '' : String(v);
      return td;
    }
    function render() {
      var list = visibleRows();
      tbody.innerHTML = '';
      lastList = list;
      var keep = {};
      state.rows.forEach(function (r, i) { keep[keyOf(r, i)] = true; });
      Object.keys(picked).forEach(function (k) { if (!keep[k]) delete picked[k]; });
      list.forEach(function (x) {
        var r = doc.createElement('tr'), key = keyOf(x.r, x.i);
        r.setAttribute('data-i', x.i);
        var rc = [];
        if (o.onRowClick) { rc.push('click'); r.tabIndex = 0; }
        if (sel || exp) rc.push('jp-row');
        r.className = rc.join(' ');
        if (sel) {
          r.setAttribute('aria-selected', picked[key] ? 'true' : 'false');
          var tdc = doc.createElement('td'); tdc.className = 'jp-cb';
          tdc.innerHTML = '<label class="jp-ck"><input type="checkbox" class="ck rk"' + (picked[key] ? ' checked' : '') + ' aria-label="' + esc(sel.label ? sel.label(x.r) : 'Select row') + '"></label>';
          r.appendChild(tdc);
        }
        if (exp) {
          var tdx = doc.createElement('td'); tdx.className = 'jp-cx';
          var did = uid('jpk-detail');
          tdx.innerHTML = '<button type="button" class="jp-chev" aria-expanded="' + (!!opened[key]) + '" aria-controls="' + did + '" aria-label="' + esc(o.expandLabel ? o.expandLabel(x.r) : 'Show details') + '"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>';
          r.appendChild(tdx);
          r.setAttribute('data-detail', did);
        }
        cols.forEach(function (c) { r.appendChild(cell(c, x.r)); });
        tbody.appendChild(r);
        if (exp) {
          var dr2 = doc.createElement('tr'); dr2.className = 'jp-detail'; dr2.id = r.getAttribute('data-detail'); dr2.hidden = !opened[key];
          var dtd = doc.createElement('td'); dtd.colSpan = cols.length + (sel ? 1 : 0) + 1;
          dr2.appendChild(dtd); tbody.appendChild(dr2);
          if (opened[key]) fillDetail(dr2, x.r);
        }
      });
      refreshSel();
      var none = list.length === 0;
      tw.hidden = none; emptyEl.hidden = !none;
      emptyEl.innerHTML = '<b>' + esc(empty.title || 'Nothing here') + '</b>' + (empty.hint ? esc(empty.hint) : '');
      Array.prototype.forEach.call(thead.querySelectorAll('th.sort'), function (th) {
        var k = th.getAttribute('data-k');
        th.setAttribute('aria-sort', k === state.sortKey ? (state.dir > 0 ? 'ascending' : 'descending') : 'none');
      });
      if (pills) {
        pills.innerHTML = filters.map(function (f) {
          return '<button type="button" class="pill" data-f="' + esc(f.key) + '" aria-pressed="' + (f.key === state.filter) + '">' + esc(f.label) + '</button>';
        }).join('');
      }
    }
    function fillDetail(dr2, row) {
      var td = dr2.firstChild;
      if (td.firstChild) return;
      var v = exp(row);
      if (v && v.nodeType) td.appendChild(v); else td.innerHTML = v == null ? '' : String(v);
    }
    function setOpen(trEl, on) {
      var i = +trEl.getAttribute('data-i'), key = keyOf(state.rows[i], i);

  var demo = /[?&]wtdemo=1\b/.test(location.search);
  var list = null;

  function setNote(t) { note.textContent = t || ''; note.hidden = !t; }
  function open(item) {
    if (demo) { setNote('Demo mode: the ' + ({ Cases: 'case', Tasks: 'task', Billing_Findings: 'billing finding', Support_Emails: 'support email' }[item.kind] || 'record') + ' would open in Zoho.'); return; }
    try { ZOHO.CRM.UI.Record.open({ Entity: item.kind, RecordID: item.recordId, Target: '_blank' }); } catch (e) { setNote('Could not open the record: ' + (e && e.message || e)); }
  }
  function withOpen(items) { return items.map(function (it) { it.next = Object.assign({}, it.next, { onClick: function () { open(it); } }); return it; }); }
  function show(res, now) {
    root.hidden = false; root.removeAttribute('aria-busy');
    var items = withOpen(res.items), un = withOpen(res.unassigned);
    list = JPK.workList({ mount: mount, items: items, unassigned: un, now: now, title: cfg.title, subtitle: res.text });
    setNote(res.note);
  }

  /* ---------- live ---------- */
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function withTimeout(p, ms) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timed out')); }, ms); })]); }
  var stage = 'start';
  function ready(tries) {
    return Promise.resolve().then(function () {
      if (!(window.ZOHO && ZOHO.CRM && ZOHO.CRM.CONFIG && ZOHO.CRM.API)) throw new Error('no zoho');
      stage = 'getCurrentUser';
      return withTimeout(ZOHO.CRM.CONFIG.getCurrentUser(), 6000).then(function (r) { var u = r && r.users && r.users[0]; if (!u) throw new Error('no user'); return u; });
    });
  }
  function retry(n) { return ready().catch(function (e) { if (n <= 0) throw e; return wait(1500).then(function () { return retry(n - 1); }); }); }
  function query(q) {
    return withTimeout(JPK.crm.coqlAll(q, { maxPages: 5 }), 25000).catch(function (e) { stage = 'query failed: ' + (e && e.message || e); return null; });
  }
  function live() {
    if (!(window.ZOHO)) { root.hidden = true; return; }
    var dog = setTimeout(function () { if (root.getAttribute('aria-busy') === 'true') { mount.innerHTML = '<p class="wt-load">Your work list could not load (' + stage + '). Reload the page; if it persists, tell Beau.</p>'; } }, 60000);
    retry(6).then(function (u) {
      stage = 'getAllUsers';
      var me = String(u.id);
      return withTimeout(ZOHO.CRM.API.getAllUsers({ Type: 'ActiveUsers' }), 8000).then(function (r) { return (r && r.users) || []; }, function () { return []; }).then(function (users) {
        users = users.filter(function (x) { return x.status == null || /^active$/i.test(x.status); }).map(function (x) { return { id: String(x.id), name: x.full_name || x.email || '', profile: (x.profile && x.profile.name) || '' }; });
        var queueIds = users.filter(function (x) { return cfg.queueProfiles.indexOf(x.profile) > -1; }).map(function (x) { return x.id; });
        stage = 'queries';
        return Promise.all([query(M.Q.cases(me)), query(M.Q.tasks(me)), query(M.Q.findings(me)), query(M.Q.emails(me)), query(M.Q.teamCases(me))]).then(function (r) {
          var res = M.build({ cases: r[0], tasks: r[1], findings: r[2], emails: r[3], teamCases: r[4] }, { users: users, now: new Date(), meId: me, queueIds: queueIds, teams: cfg.teams, defaultTeam: cfg.defaultTeam });
          stage = 'show'; clearTimeout(dog); show(res, new Date());
        });
      });
    }).catch(function (e) { clearTimeout(dog); root.hidden = true; });
  }

  /* ---------- demo ---------- */
  function runDemo() {
    var now = new Date(), results = W.results(now), f = /[?&]wtskip=([a-z,]+)/.exec(location.search);
    if (f) f[1].split(',').forEach(function (k) { results[k] = null; });
    show(M.build(results, { users: W.users, now: now, meId: W.me, queueIds: W.queueIds, teams: cfg.teams.length ? cfg.teams : ['EM Support'], defaultTeam: cfg.defaultTeam || !cfg.teams.length }), now);
  }

  root.hidden = false; root.setAttribute('aria-busy', 'true'); mount.innerHTML = '<p class="wt-load">Loading your work…</p>';
  if (demo && W) runDemo(); else live();
})();

</script>
<script src="jpk-intro.js"
  data-id="your-work-today"
  data-what="One list of everything with your name on it that is due or overdue, across cases, tasks, findings and renewals. Replaces the weekly digest email."
  data-fed="Cases, Tasks, Billing Findings, Contracts"
  data-feeds="Nothing (opens the record)"></script>
</body></html>
