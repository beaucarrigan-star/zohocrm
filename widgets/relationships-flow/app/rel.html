<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relationships flow</title>
<link rel="stylesheet" href="jpk.css">
<link rel="stylesheet" href="rel.css">
</head>
<body>
<div class="wrap">
  <header class="rec">
    <div>
      <div class="eyebrow">Accounts, contacts and opportunities</div>
      <h1>Relationships flow</h1>
      <div class="muted sm" id="asof"></div>
    </div>
    <div class="actions">
      <span id="demo-flag" hidden><span class="chip info">Demo data</span></span>
      <div class="seg" id="scope" role="group" aria-label="Which accounts to show"></div>
      <label class="lead lim sm">Cold after <input type="number" id="lim-touch" min="1" max="365" step="1" value="60" aria-label="Days without a touch before an account counts as cold"> days</label>
      <label class="lead lim sm">Idle after <input type="number" id="lim-deal" min="1" max="365" step="1" value="30" aria-label="Days without activity before an opportunity counts as idle"> days</label>
      <button type="button" class="btn" id="refresh">Refresh</button>
      <button type="button" class="btn" id="help">How this works</button>
    </div>
  </header>

  <div id="nx"></div>

  <ol class="flow" id="flow" aria-label="Path from account to renewal"></ol>

  <section class="card lane-card" aria-live="polite">
    <h2><span id="lane-title">Pick a step above</span><em id="lane-hint"></em></h2>
    <div id="lane-table"></div>
  </section>
  <p class="muted sm" id="foot"></p>
</div>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<script src="jpk.js"></script>
<script src="rel-flow-model.js"></script>
<script src="demo-data.js"></script>
<script src="flow-tools.js"></script>
<script src="rel.js"></script>
<script src="jpk-intro.js"
  data-what="Follows each account from who they are, through their contacts and last touch, to open opportunities and renewal. Click a step to see its records, then a record to see the whole path for that account."
  data-fed="Accounts, Contacts and Opportunities (read-only)."
  data-feeds="Nothing (read-only). Open the account, contact or opportunity from the path to change it; Customer 360 shows one account in full."></script>
</body>
</html>
